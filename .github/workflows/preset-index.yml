name: Regenerate preset index

# Layer 1 of the preset-index freshness chain (see the header of scripts/gen-preset-index.mjs):
# whenever preset files change, regenerate model-configs/index.json and commit
# it, so the live remote list can never lag the directory. Layer 2 is the
# Vitest drift test (npm run build gate). index.json changes are excluded to
# avoid a self-trigger loop (belt: the bot commit also carries [skip ci]).
#
# TAG PUSHES MUST NOT RUN THIS (branches + tags-ignore + the ref_type guard):
# GitHub ignores `paths` filters on tag pushes, so every tag push used to run
# the workflow file frozen at that tag's commit. On old tags the bot's commit
# step then failed: the checkout is a detached HEAD and `git push` from one
# dies with exit 128. (Pushing an OLD tag again still runs the OLD workflow
# file - main's fix cannot reach into the past.)

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths:
      - 'model-configs/**'
      - '!model-configs/index.json'
      - 'scripts/gen-preset-index.mjs'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The generator is dependency-free Node — no npm install needed.
      - name: Generate index.json
        run: node scripts/gen-preset-index.mjs

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- model-configs/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add model-configs/index.json
            git commit -m "chore: regenerate preset index [skip ci]"
            git push
            echo "index.json regenerated and pushed"
          else
            echo "index.json already current"
          fi
